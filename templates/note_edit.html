{% extends "base.html" %}

{% block title %}Редактировать заметку — K-PRO Sorbonne 09 TeamSpace{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <a href="/projects/{{ project.id }}" class="text-sm text-indigo-600 hover:text-indigo-800">← {{ project.title }}</a>
    <h1 class="text-2xl font-bold text-gray-900 mt-4 mb-6">Редактировать заметку</h1>

    <div class="bg-white shadow rounded-lg p-6">
        <form action="/notes/{{ note.id }}/edit" method="post" class="space-y-4">
            <div>
                <label for="content" class="block text-sm font-medium text-gray-700 mb-1">Текст заметки</label>
                <textarea
                    id="content"
                    name="content"
                    rows="8"
                    required
                    class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 focus:border-indigo-600 focus:outline-none focus:ring-1 focus:ring-indigo-600"
                >{{ note.content }}</textarea>
            </div>
            <div class="flex items-center gap-3">
                <button
                    type="submit"
                    class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700"
                >
                    Сохранить
                </button>
                <a
                    href="/projects/{{ project.id }}"
                    class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50"
                >
                    Отмена
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
