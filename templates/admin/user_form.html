{% extends "base.html" %}

{% block title %}Редактирование пользователя — Админ{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="/admin/users" class="text-sm text-indigo-600 hover:text-indigo-800">← Пользователи</a>
    <h1 class="text-2xl font-bold text-gray-900 mt-2">Редактирование пользователя</h1>
</div>

{% if error == 'username_exists' %}
<div class="mb-4 rounded-md bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700">
    Пользователь с таким именем уже существует.
</div>
{% endif %}

<div class="bg-white shadow rounded-lg p-6 max-w-2xl">
    <form action="{{ form_action }}" method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Имя пользователя</label>
            <input type="text" name="username" value="{{ user.username }}" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Полное имя</label>
            <input type="text" name="full_name" value="{{ user.full_name }}" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Business role</label>
            <input type="text" name="business_role" value="{{ user.business_role or '' }}" placeholder="CEO, CTO, CDO..." class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">System role</label>
            <select name="system_role" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
                {% for role in system_roles %}
                <option value="{{ role }}" {% if user.system_role == role %}selected{% endif %}>{{ role }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="flex gap-3">
            <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">Сохранить</button>
            <a href="/admin/users" class="rounded-md border border-gray-300 px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
