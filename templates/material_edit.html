{% extends "base.html" %}

{% block title %}Редактировать материал — K-PRO Sorbonne 09 TeamSpace{% endblock %}

{% block breadcrumbs %}
<nav class="text-sm text-gray-500 mb-4" aria-label="Навигация">
    <a href="/" class="hover:text-gray-700">Главная</a>
    <span class="mx-1">/</span>
    <a href="/materials" class="hover:text-gray-700">Материалы</a>
    <span class="mx-1">/</span>
    <span class="text-gray-900 font-medium">Редактирование</span>
</nav>
{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-900 mb-6">Редактировать материал</h1>

    <div class="bg-white shadow rounded-lg p-6">
        <form action="/materials/{{ material.id }}/edit" method="post" class="space-y-4">
            <div>
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Заголовок</label>
                <input type="text" id="title" name="title" value="{{ material.title }}" required class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
            </div>
            <div>
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Описание</label>
                <textarea id="description" name="description" rows="4" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">{{ material.description or '' }}</textarea>
            </div>
            <div>
                <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Категория</label>
                <select id="category" name="category" class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
                    {% for cat in categories %}
                    <option value="{{ cat }}" {% if material.category == cat %}selected{% endif %}>{{ cat }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="url" class="block text-sm font-medium text-gray-700 mb-1">Ссылка (необязательно)</label>
                <input type="url" id="url" name="url" value="{{ material.url or '' }}" placeholder="https://..." class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm">
            </div>
            <div class="flex items-center gap-3">
                <button type="submit" class="rounded-md bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">Сохранить</button>
                <a href="/materials" class="text-sm text-gray-600 hover:text-indigo-600">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
